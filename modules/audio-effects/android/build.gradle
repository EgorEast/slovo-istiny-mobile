plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ru.slovopropovedi'
version = '0.1.0'

android {
  namespace "ru.slovopropovedi.audioeffects"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

// expo-audio is built from source (expo.autolinking.buildFromSource in package.json)
// because the loop-getter patch requires compiling expo-audio's Kotlin sources;
// `:expo-audio` resolves to the project in node_modules/expo-audio/android and
// carries the patch.

repositories {
  mavenCentral()
}

dependencies {
  implementation project(':expo-audio')

  // Explicit media3 copies so this module compiles against ExoPlayer types even
  // if the expo-audio publication stops exposing them as `api`.
  def androidxMedia3Version = "1.9.0"
  implementation "androidx.media3:media3-common:$androidxMedia3Version"
  implementation "androidx.media3:media3-exoplayer:$androidxMedia3Version"

  testImplementation "junit:junit:4.13.2"
}
